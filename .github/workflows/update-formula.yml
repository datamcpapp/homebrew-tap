name: Update agent formula

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-formula.mjs
      - run: ruby -c Formula/datamcp-agent.rb
      - name: Publish formula update
        run: |
          if git diff --quiet -- Formula/datamcp-agent.rb; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/datamcp-agent.rb
          git commit -m "Update datamcp-agent formula"
          git push
